name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # Vite production mode also loads committed `.env.production`.
      # Pin the same values here so Pages never ships the demo-mode banner.
      - run: npm run build
        env:
          VITE_TREASURY_WALLET: GXoU9jG9G4iGrquMLfyMvUuzW6Rvn2t5nGSC1UWg5y57
          VITE_SOL_PER_PIXEL: '0.0115'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
